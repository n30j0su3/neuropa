<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f1117">
<title>NeuroPA · Espacio para tu mente</title>
<style>
:root{--bg:#0f1117;--surface:#1a1d27;--surface2:#222631;--txt:#e4e4ed;--txt2:#9090a8;--txt3:#555570;--bdr:rgba(255,255,255,.06);--accent:#40E0D0;--accent-dim:rgba(64,224,208,.15);--amber:#fbbf24;--green:#34d399;--shadow:0 4px 12px rgba(0,0,0,.5);--radius:16px;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--txt)}body{font-size:16px;line-height:1.5}button,input,textarea{font:inherit}button{cursor:pointer}.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.sidebar{border-right:1px solid var(--bdr);padding:28px 16px;display:flex;flex-direction:column;gap:28px;background:rgba(15,17,23,.94)}.brand{display:flex;gap:12px;align-items:center;padding:0 12px}.brand-mark{width:36px;height:36px;border-radius:12px;background:var(--accent);color:#0f1117;display:grid;place-items:center;font-weight:900;box-shadow:0 0 28px rgba(64,224,208,.25)}.brand strong{font-size:1.08rem;letter-spacing:.02em}.brand small{display:block;color:var(--txt2);font-size:.7rem;margin-top:2px}.nav{display:grid;gap:6px}.nav button{border:1px solid transparent;background:transparent;color:var(--txt2);padding:13px 14px;border-radius:12px;text-align:left;display:flex;align-items:center;gap:12px;min-height:48px;transition:background .2s,color .2s,transform .2s}.nav button:hover{background:var(--surface);color:var(--txt)}.nav button.active{background:var(--accent-dim);color:var(--accent);border-color:rgba(64,224,208,.22)}.nav svg{width:20px;height:20px;flex:none}.sidebar-foot{margin-top:auto;color:var(--txt3);font-size:.75rem;padding:0 12px}.main{min-width:0;padding:30px clamp(22px,5vw,72px) 64px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:44px}.eyebrow{color:var(--accent);text-transform:uppercase;letter-spacing:.16em;font-size:.7rem;font-weight:800}.topbar h1{font-size:clamp(1.5rem,2.7vw,2.2rem);margin:4px 0 0;letter-spacing:-.04em}.status{font-size:.78rem;color:var(--txt2);display:flex;align-items:center;gap:8px}.dot{width:8px;height:8px;background:var(--green);border-radius:50%;box-shadow:0 0 0 4px rgba(52,211,153,.12)}.view{display:none;max-width:940px;margin:auto}.view.active{display:block;animation:rise .3s ease}.hero{max-width:760px;margin:0 auto 34px}.hero h2{font-size:clamp(2.25rem,6vw,4.8rem);line-height:1.03;letter-spacing:-.07em;margin:0 0 18px;max-width:720px}.hero h2 span{color:var(--accent)}.hero p{color:var(--txt2);font-size:1.05rem;margin:0}.capture-box{background:var(--surface);border:1px solid var(--bdr);border-radius:22px;box-shadow:var(--shadow);padding:10px;display:flex;gap:10px;align-items:flex-end}.capture-box textarea{flex:1;min-height:86px;resize:vertical;background:transparent;border:0;color:var(--txt);padding:15px;font-size:1.1rem;outline:none}.capture-box textarea::placeholder{color:var(--txt3)}.primary{background:var(--accent);color:#0b1515;border:0;border-radius:13px;padding:13px 18px;font-weight:800;min-height:48px}.primary:hover{filter:brightness(1.08);transform:translateY(-1px)}.secondary{background:var(--surface2);color:var(--txt);border:1px solid var(--bdr);border-radius:12px;padding:11px 15px;min-height:44px}.ghost{background:transparent;color:var(--txt2);border:0;padding:10px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:34px 0 14px}.section-head h3{margin:0;font-size:1rem}.muted{color:var(--txt2)}.empty{border:1px dashed rgba(255,255,255,.12);border-radius:16px;padding:32px;text-align:center;color:var(--txt2);background:rgba(255,255,255,.015)}.item-list{display:grid;gap:10px}.inbox-item,.card{background:var(--surface);border:1px solid var(--bdr);border-radius:16px;padding:17px 18px;box-shadow:0 2px 8px rgba(0,0,0,.18)}.inbox-item{display:flex;justify-content:space-between;gap:15px;align-items:flex-start}.inbox-item p{margin:0;color:var(--txt)}.item-meta{font-size:.75rem;color:var(--txt3);margin-top:7px}.actions{display:flex;gap:6px;flex-wrap:wrap}.clarify{color:var(--accent);background:transparent;border:1px solid rgba(64,224,208,.3);padding:8px 11px;border-radius:9px;white-space:nowrap}.clarify-result{margin-top:12px;padding-top:12px;border-top:1px solid var(--bdr);color:var(--txt2);font-size:.9rem}.clarify-result strong{color:var(--txt)}.today-grid{display:grid;gap:18px}.recovery{background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.3);border-radius:16px;padding:18px;display:flex;justify-content:space-between;gap:18px;align-items:center;margin-bottom:18px}.recovery strong{color:var(--amber)}.mit{padding:28px;background:linear-gradient(145deg,var(--surface),#202832);border-color:rgba(64,224,208,.2)}.mit-label{font-size:.7rem;color:var(--accent);font-weight:800;letter-spacing:.15em;text-transform:uppercase}.mit h2{font-size:clamp(1.7rem,4vw,3rem);line-height:1.05;letter-spacing:-.05em;margin:12px 0}.focus-chip{color:var(--amber);font-size:.85rem}.parking summary{cursor:pointer;color:var(--txt2);font-weight:700}.parking ul{margin:15px 0 0;padding-left:20px;color:var(--txt2)}.preset-row{display:flex;gap:8px;flex-wrap:wrap}.preset-row button{border:1px solid var(--bdr);background:var(--surface2);color:var(--txt2);border-radius:20px;padding:8px 13px}.preset-row button.active{border-color:var(--accent);color:var(--accent);background:var(--accent-dim)}.focus-wrap{text-align:center;max-width:640px;margin:auto}.timer{width:min(300px,70vw);aspect-ratio:1;border-radius:50%;margin:28px auto;display:grid;place-items:center;background:conic-gradient(var(--accent) var(--progress,0%),var(--surface2) 0);position:relative}.timer:after{content:"";position:absolute;inset:15px;border-radius:50%;background:var(--bg);border:1px solid var(--bdr)}.timer-content{position:relative;z-index:1}.timer-value{font-variant-numeric:tabular-nums;font-size:3.4rem;letter-spacing:-.07em;font-weight:800}.timer-state{color:var(--txt2);font-size:.85rem}.focus-actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.reflection{margin-top:28px;text-align:left}.field{display:grid;gap:7px;margin:14px 0}.field label{font-size:.8rem;color:var(--txt2)}.field input,.field textarea{width:100%;background:var(--surface2);border:1px solid var(--bdr);color:var(--txt);padding:12px 13px;border-radius:11px;outline:none}.field input:focus,.field textarea:focus,.capture-box:focus-within{border-color:rgba(64,224,208,.6);box-shadow:0 0 0 3px var(--accent-dim)}.memory-search{display:flex;gap:10px}.memory-search input{flex:1}.evidence{border-color:rgba(52,211,153,.25);background:rgba(52,211,153,.06);margin-top:18px}.neutral{margin-top:18px}.evidence h3{margin:0 0 10px;color:var(--green)}.confidence{color:var(--green);font-size:.85rem}.provider-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.provider{position:relative}.provider .state{position:absolute;right:14px;top:14px;width:9px;height:9px;border-radius:50%;background:var(--txt3)}.provider.active .state{background:var(--green);box-shadow:0 0 0 4px rgba(52,211,153,.1)}.provider h3{margin:0 0 8px;text-transform:capitalize}.privacy{line-height:1.7;color:var(--txt2)}.privacy strong{color:var(--txt)}.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:18px}.switch{width:50px;height:28px;border-radius:20px;background:var(--surface2);border:1px solid var(--bdr);padding:3px}.switch span{display:block;width:20px;height:20px;border-radius:50%;background:var(--txt3);transition:transform .2s}.switch.on{background:var(--accent-dim);border-color:var(--accent)}.switch.on span{background:var(--accent);transform:translateX(21px)}.toast{position:fixed;right:24px;bottom:24px;background:var(--surface2);border:1px solid rgba(64,224,208,.35);color:var(--txt);padding:13px 16px;border-radius:12px;box-shadow:var(--shadow);opacity:0;transform:translateY(10px);pointer-events:none;transition:.25s}.toast.show{opacity:1;transform:none}.offline{min-height:100vh;display:grid;place-items:center;padding:24px}.offline-card{max-width:560px;text-align:center;background:var(--surface);border:1px solid var(--bdr);border-radius:24px;padding:42px 30px;box-shadow:var(--shadow)}.offline-card h1{font-size:clamp(2rem,6vw,4rem);letter-spacing:-.07em;margin:15px 0}.offline-card p{color:var(--txt2)}.offline-card code{display:block;margin-top:20px;background:var(--surface2);padding:12px;border-radius:10px;color:var(--accent)}:focus-visible{outline:3px solid var(--accent);outline-offset:3px}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@media(max-width:760px){.shell{display:block}.sidebar{position:sticky;top:0;z-index:10;border-right:0;border-bottom:1px solid var(--bdr);padding:12px 14px;gap:10px}.brand{padding:0 4px}.brand-mark{width:32px;height:32px}.nav{display:flex;overflow:auto}.nav button{padding:9px 11px;min-height:42px;white-space:nowrap}.nav button span{display:none}.sidebar-foot{display:none}.main{padding:24px 16px 48px}.topbar{margin-bottom:32px}.status{display:none}.capture-box{display:block}.capture-box .primary{width:100%;margin-top:8px}.inbox-item{display:block}.inbox-item .actions{margin-top:12px}.recovery{display:block}.recovery .secondary{margin-top:12px}.provider-grid{grid-template-columns:1fr}.hero h2{font-size:clamp(2.3rem,13vw,4rem)}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<!-- CAPTURE TODAY FOCUS MEMORY SETTINGS · NeuroPA F2 premium SPA -->
<div id="app"><div class="offline"><div class="offline-card"><div class="brand-mark" style="margin:auto">N</div><h1>NeuroPA</h1><p>Conectando con tu espacio mental local…</p></div></div></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
(() => {
  const state={token:null,view:'capture',inbox:[],today:null,recovery:null,ws:null,focus:{planned:25,elapsed:0,remaining:1500,status:'idle',taskId:null},timer:null,privacySensitive:localStorage.getItem('neuropa-privacy')==='true'};
  const icon={capture:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/><circle cx="12" cy="12" r="8"/></svg>',today:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>',focus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><path d="M12 8v5l3 2"/></svg>',memory:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 5h14v14H5z"/><path d="M8 9h8M8 12h6M8 15h4"/></svg>',settings:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="m19.4 15 .1.1-1.8 3.1-.2-.1a2 2 0 0 0-2.7.8l-.1.2h-3.6l-.1-.2a2 2 0 0 0-2.7-.8l-.2.1-1.8-3.1.1-.1a2 2 0 0 0 0-3l-.1-.1 1.8-3.1.2.1a2 2 0 0 0 2.7-.8l.1-.2h3.6l.1.2a2 2 0 0 0 2.7.8l.2-.1 1.8 3.1-.1.1a2 2 0 0 0 0 3Z"/></svg>'};
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const toast=(msg)=>{const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2600)};
  async function api(path,options={}){const res=await fetch(path,{...options,headers:{'Content-Type':'application/json','Authorization':`Bearer ${state.token}`,...(options.headers||{})}});if(!res.ok)throw new Error(`${res.status}`);return res.status===204?null:res.json()}
  function nav(){return `<aside class="sidebar"><div class="brand"><div class="brand-mark">N</div><div><strong>NeuroPA</strong><small>tu espacio local</small></div></div><nav class="nav" aria-label="Navegación">${[['capture','Capturar'],['today','Hoy'],['focus','Foco'],['memory','Memoria'],['settings','Ajustes']].map(([id,label])=>`<button class="${state.view===id?'active':''}" data-view="${id}" aria-label="${label}">${icon[id]}<span>${label}</span></button>`).join('')}</nav><div class="sidebar-foot">C=capturar · T=hoy · F=foco<br>M=memoria · S=ajustes</div></aside>`}
  function layout(content){document.getElementById('app').innerHTML=`<div class="shell">${nav()}<main class="main"><header class="topbar"><div><div class="eyebrow">NeuroPA / ${state.view}</div><h1>${({capture:'Vuelca tu mente',today:'Un día posible',focus:'Un bloque a la vez',memory:'Memoria con evidencia',settings:'Control local'})[state.view]}</h1></div><div class="status"><span class="dot"></span>API local conectada</div></header>${content}</main></div>`;document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>show(b.dataset.view))}
  function captureView(){layout(`<section class="view active" id="capture-view"><div class="hero"><h2>¿Qué tienes<br>en la <span>cabeza?</span></h2><p>Sin categorizar. Sin organizar. Solo captura. Luego vemos.</p></div><form class="capture-box" id="capture-form"><textarea id="capture-input" aria-label="Qué tienes en la cabeza" placeholder="Escribe una idea, pendiente o preocupación…" autofocus></textarea><button class="primary" type="submit">Capturar <span aria-hidden="true">↵</span></button></form><div class="section-head"><h3>Inbox</h3><span class="muted" id="inbox-count"></span></div><div id="inbox-list" class="item-list"></div></section>`);document.getElementById('capture-form').onsubmit=async e=>{e.preventDefault();const input=document.getElementById('capture-input');const raw=input.value.trim();if(!raw)return;try{await api('/api/inbox',{method:'POST',body:JSON.stringify({raw_text:raw})});input.value='';toast('Capturado. Ya está fuera de tu cabeza.');await loadInbox()}catch(err){toast('No pude guardar la captura. Inténtalo de nuevo.')}};loadInbox()}
  async function loadInbox(){try{state.inbox=await api('/api/inbox');const list=document.getElementById('inbox-list');if(!list)return;document.getElementById('inbox-count').textContent=state.inbox.length?`${state.inbox.length} idea${state.inbox.length===1?'':'s'}`:'';list.innerHTML=state.inbox.length?state.inbox.map(item=>`<article class="inbox-item" data-id="${esc(item.id)}"><div><p>${esc(item.raw_text)}</p><div class="item-meta">${esc(new Date(item.created_at).toLocaleString('es-ES',{dateStyle:'medium',timeStyle:'short'}))}</div><div id="clarify-${esc(item.id)}"></div></div><div class="actions"><button class="clarify" data-clarify="${esc(item.id)}">Clarificar</button></div></article>`).join(''):`<div class="empty">Vacía tu mente aquí.<br>Sin categorizar, sin organizar. Solo captura.</div>`;document.querySelectorAll('[data-clarify]').forEach(b=>b.onclick=()=>clarify(b.dataset.clarify))}catch(e){}}
  async function clarify(id){const item=state.inbox.find(x=>x.id===id);if(!item)return;const slot=document.getElementById(`clarify-${id}`);slot.innerHTML='<div class="clarify-result muted">Pensando en el siguiente paso…</div>';try{const result=await api('/api/ai/clarify',{method:'POST',body:JSON.stringify({raw_text:item.raw_text,privacy_sensitive:state.privacySensitive})});slot.innerHTML=`<div class="clarify-result"><strong>Siguiente paso:</strong> ${esc(result.next_action||result.title||'Definir un primer paso pequeño')} ${(result.steps||[]).length?`<ul>${result.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>`:''}</div>`}catch(e){slot.innerHTML='<div class="clarify-result">La clarificación no está disponible ahora. La captura queda guardada.</div>'}}
  async function todayView(){layout('<section class="view active" id="today-view"><div id="today-content" class="today-grid"><div class="empty">Cargando tu día…</div></div></section>');try{const data=await api('/api/today');state.today=data.today;state.recovery=data.recovery;renderToday()}catch(e){document.getElementById('today-content').innerHTML='<div class="empty">No pude cargar hoy. Puedes volver a Capturar.</div>'}}
  function renderToday(){const t=state.today||{};const r=state.recovery||{};const mit=t.mit;document.getElementById('today-content').innerHTML=`${r.needs_recovery?`<div class="recovery"><div><strong>Bienvenida de vuelta.</strong><div>¿Empezamos de nuevo desde hoy?</div></div><button class="secondary" id="restart">Recomenzar</button></div>`:''}<div class="preset-row" aria-label="Presets del día"><button class="active">Día mínimo</button><button>Día normal</button><button>Recuperación</button><button>Solo foco</button></div>${mit?`<article class="card mit"><div class="mit-label">Tu única acción principal</div><h2>${esc(mit.title)}</h2>${mit.next_action?`<p class="muted">Primer paso: ${esc(mit.next_action)}</p>`:''}${mit.focus_block?'<div class="focus-chip">◆ Bloque de foco sugerido</div>':''}<button class="primary" id="start-mit" data-id="${esc(mit.id)}" style="margin-top:20px">Iniciar foco</button></article>`:'<div class="card empty"><strong>No hay tarea principal todavía.</strong><br>Captura una idea primero y la convertiremos en un siguiente paso.</div>'}${t.focus_block?`<div class="card"><strong>Bloque de foco</strong><p class="muted">${esc(t.focus_block.title)}</p></div>`:''}<details class="card parking"><summary>Parking lot · ${Math.min((t.parking_lot||[]).length,5)} para más tarde</summary><ul>${(t.parking_lot||[]).slice(0,5).map(x=>`<li>${esc(x.title)}</li>`).join('')||'<li>Está vacío por ahora.</li>'}</ul></details>`;document.getElementById('start-mit')?.addEventListener('click',async e=>{try{await api(`/api/tasks/${e.currentTarget.dataset.id}/start`,{method:'PUT'});state.focus.taskId=e.currentTarget.dataset.id;show('focus');toast('Foco listo. Un paso pequeño.') }catch(err){toast('No pude iniciar foco todavía.')}});document.getElementById('restart')?.addEventListener('click',()=>{toast('Sin deuda. Hoy empieza ahora.');document.getElementById('restart').disabled=true})}
  function focusView(){layout(`<section class="view active" id="focus-view"><div class="focus-wrap"><p class="muted">Elige cuánto espacio quieres darte</p><div class="preset-row" id="focus-presets">${[5,10,25,50].map(m=>`<button class="${state.focus.planned===m?'active':''}" data-min="${m}">${m} min</button>`).join('')}</div><div class="timer" id="timer"><div class="timer-content"><div class="timer-value" id="timer-value">${formatTime(state.focus.remaining)}</div><div class="timer-state" id="timer-state">Listo cuando tú estés</div></div></div><div class="focus-actions"><button class="primary" id="focus-start">Start</button><button class="secondary" id="focus-pause">Pause</button><button class="secondary" id="focus-complete">Complete</button><button class="ghost" id="focus-abandon">Continuar mañana</button></div><div class="reflection" id="reflection" hidden><div class="field"><label for="reflection-input">¿Qué hizo más fácil empezar? (opcional)</label><textarea id="reflection-input" rows="3" placeholder="Una frase, sin evaluar…"></textarea></div></div></div></section>`);document.querySelectorAll('#focus-presets button').forEach(b=>b.onclick=()=>{if(state.focus.status==='idle'){state.focus.planned=Number(b.dataset.min);state.focus.remaining=state.focus.planned*60;focusView()}});connectWs();document.getElementById('focus-start').onclick=()=>focusAction('start');document.getElementById('focus-pause').onclick=()=>focusAction('pause');document.getElementById('focus-complete').onclick=()=>focusAction('complete');document.getElementById('focus-abandon').onclick=()=>focusAction('abandon');updateTimer()}
  const formatTime=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
  function updateTimer(){const el=document.getElementById('timer-value');if(el)el.textContent=formatTime(state.focus.remaining);const timer=document.getElementById('timer');if(timer)timer.style.setProperty('--progress',`${Math.min(100,state.focus.elapsed/(state.focus.planned*60)*100)}%`);const st=document.getElementById('timer-state');if(st)st.textContent=state.focus.status==='running'?'En foco':state.focus.status==='paused'?'En pausa':state.focus.status==='completed'?'Completado':'Listo cuando tú estés'}
  function connectWs(){if(state.ws&&state.ws.readyState<2)return;const proto=location.protocol==='https:'?'wss':'ws';try{state.ws=new WebSocket(`${proto}://${location.host}/ws/focus?token=${encodeURIComponent(state.token)}`);state.ws.onmessage=e=>{const msg=JSON.parse(e.data);if(msg.state){state.focus.status=msg.state;if(msg.state==='completed'||msg.state==='abandoned')document.getElementById('reflection')?.removeAttribute('hidden')}if(typeof msg.elapsed_sec==='number'){state.focus.elapsed=msg.elapsed_sec;state.focus.remaining=Math.max(0,state.focus.planned*60-msg.elapsed_sec)}updateTimer()}}catch(e){toast('El timer local sigue disponible sin conexión.')}}
  function focusAction(action){connectWs();if(!state.ws||state.ws.readyState!==1){toast('El foco necesita la API local activa.');return}const reflection=document.getElementById('reflection-input')?.value||'';state.ws.send(JSON.stringify({action,task_id:state.focus.taskId||state.today?.mit?.id,planned_min:state.focus.planned,reflection}));if(action==='start'){state.focus.status='running';if(!state.timer)state.timer=setInterval(()=>{if(state.focus.status==='running'){state.focus.elapsed++;state.focus.remaining=Math.max(0,state.focus.planned*60-state.focus.elapsed);state.ws?.send(JSON.stringify({action:'tick'}));updateTimer()}},1000)}if(action==='pause')state.focus.status='paused';if(action==='complete'||action==='abandon'){state.focus.status=action==='complete'?'completed':'abandoned';clearInterval(state.timer);state.timer=null}updateTimer()}
  async function memoryView(){layout(`<section class="view active" id="memory-view"><div class="card"><div class="memory-search"><input class="field" id="memory-query" aria-label="Buscar memoria" placeholder="Busca algo que recuerdes…"><button class="primary" id="memory-search-btn">Buscar</button></div><div id="memory-result"></div></div><div class="section-head"><h3>Guardar conocimiento</h3></div><form class="card" id="memory-form"><div class="field"><label for="claim">Afirmación</label><textarea id="claim" rows="3" placeholder="Ej. Mi mejor hora para escribir es la mañana."></textarea></div><div class="field"><label for="source">Fuente (opcional)</label><input id="source" placeholder="nota, conversación, documento…"></div><button class="primary">Guardar conocimiento</button></form></section>`);document.getElementById('memory-search-btn').onclick=searchMemory;document.getElementById('memory-query').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();searchMemory()}};document.getElementById('memory-form').onsubmit=async e=>{e.preventDefault();const claim=document.getElementById('claim').value.trim();if(!claim)return;try{await api('/api/memory/store',{method:'POST',body:JSON.stringify({claim_text:claim,source_ref:document.getElementById('source').value.trim()})});e.target.reset();toast('Guardado con evidencia local.')}catch(err){toast('No pude guardar ese conocimiento.')}}}
  async function searchMemory(){const q=document.getElementById('memory-query').value.trim();if(!q)return;const slot=document.getElementById('memory-result');slot.innerHTML='<div class="muted" style="margin-top:18px">Buscando evidencia…</div>';try{const r=await api('/api/memory/query',{method:'POST',body:JSON.stringify({query:q})});const match=r.confidence>0||r.claim;slot.innerHTML=match?`<article class="card evidence"><h3>Hay una coincidencia</h3><p>${esc(r.claim||r.claim_text||'')}</p><div class="confidence">Confianza ${Math.round((r.confidence||0)*100)}% · Fuente: ${esc(r.source||r.source_ref||'local')} · ${esc(r.date||'evidencia registrada')}</div></article>`:'<div class="card neutral">No tengo evidencia sobre eso todavía.</div>'}catch(e){slot.innerHTML='<div class="card neutral">No tengo evidencia sobre eso todavía.</div>'}}
  async function settingsView(){layout(`<section class="view active" id="settings-view"><div class="section-head"><h3>Modo de inteligencia</h3></div><div class="provider-grid" id="providers"><div class="empty">Cargando modos…</div></div><div class="card" style="margin-top:18px"><p class="privacy"><strong>Privacidad primero.</strong><br>Modo gestionado envía datos a tu provider configurado. Modo local nunca sale de tu dispositivo.</p><div class="toggle-row"><span>Datos sensibles siempre locales</span><button class="switch ${state.privacySensitive?'on':''}" id="privacy-toggle" role="switch" aria-checked="${state.privacySensitive}"><span></span></button></div></div><div class="card" style="margin-top:18px;display:flex;justify-content:space-between;align-items:center;gap:16px"><div><strong>Tu backup local</strong><div class="muted">Exporta tus datos cuando quieras.</div></div><button class="secondary" id="export-btn">Descargar backup</button></div></section>`);try{const p=await api('/api/providers/status');const modes=p.modes||p.providers||{};document.getElementById('providers').innerHTML=['managed','byok','local'].map(id=>{const val=modes[id]||{};const active=val.available??val.healthy??(id==='local');return `<article class="card provider ${active?'active':''}"><span class="state"></span><h3>${id}</h3><p class="muted">${id==='managed'?'Cómodo, con provider configurado.':id==='byok'?'Tu clave, tu control.':'Privado y offline.'}</p><small class="muted">${active?'Disponible':'No configurado'}</small></article>`}).join('')}catch(e){document.getElementById('providers').innerHTML='<div class="card">Modo local disponible. Los providers externos se mostrarán cuando estén configurados.</div>'}document.getElementById('privacy-toggle').onclick=e=>{state.privacySensitive=!state.privacySensitive;localStorage.setItem('neuropa-privacy',state.privacySensitive);e.currentTarget.classList.toggle('on',state.privacySensitive);e.currentTarget.setAttribute('aria-checked',state.privacySensitive)};document.getElementById('export-btn').onclick=async()=>{try{const data=await api('/api/export');const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`neuropa-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(a.href)}catch(e){toast('No pude preparar el backup.')}}}
  function show(view){state.view=view;({capture:captureView,today:todayView,focus:focusView,memory:memoryView,settings:settingsView}[view])()}
  document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea'))return;const key=e.key.toLowerCase();const map={c:'capture',t:'today',f:'focus',m:'memory',s:'settings'};if(map[key]){e.preventDefault();show(map[key])}});
  async function boot(){try{const token=await fetch('/api/token').then(r=>{if(!r.ok)throw Error();return r.json()});state.token=token.token;show('capture')}catch(e){document.getElementById('app').innerHTML='<div class="offline"><div class="offline-card"><div class="brand-mark" style="margin:auto">N</div><h1>NeuroPA no está corriendo</h1><p>Tu espacio mental necesita que la API local esté activa.</p><p>Abre una terminal en el proyecto y ejecuta:</p><code>uv run uvicorn neuropa.api.app:app --host 127.0.0.1 --port 8473</code><p class="muted">Luego vuelve a cargar esta página.</p></div></div>'}}
  boot();
})();
</script>
