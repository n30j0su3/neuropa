[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neuropa"
version = "0.1.0"
description = "Local-first personal AI assistant foundation"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7,<3",
  "pyyaml>=6.0",
  "httpx>=0.27",
]

[project.scripts]
neuropa = "neuropa.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["neuropa"]
